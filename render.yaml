services:
  - type: web
    name: postroute
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 4 app:app
    envVars:
      - key: FLASK_DEBUG
        value: "0"
